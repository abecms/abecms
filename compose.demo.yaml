# Local run of the ABECMS demo renderer.
#
# No host volume is mounted and no secret is committed: the gateway is
# stateless and reads only the fixed demo site baked into the image.
#
# !!! DEVELOPMENT ONLY !!!
# This file disables bearer authentication via ABE_DEMO_ALLOW_UNAUTHENTICATED so
# that `docker compose up` works out of the box on a loopback-bound port. NEVER
# deploy with this setting. For a production-like run, drop that variable and
# export a real token instead:
#
#   export ABE_DEMO_API_TOKEN="$(openssl rand -hex 32)"
#
# then replace the two auth variables below with:
#
#   ABE_DEMO_API_TOKEN: ${ABE_DEMO_API_TOKEN:?set a token}
services:
  abecms-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: ghcr.io/abecms/abecms-demo:local
    container_name: abecms-demo
    init: true
    read_only: true
    user: '1000:1000'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      # DEVELOPMENT ONLY — see the header of this file. Disables the bearer
      # token requirement on GET /schema and POST /render.
      ABE_DEMO_ALLOW_UNAUTHENTICATED: 'true'
      ABE_DEMO_PORT: '8080'
      ABE_DEMO_HOST: '0.0.0.0'
      ABE_DEMO_RATE_MAX: '60'
      ABE_DEMO_RATE_WINDOW_MS: '60000'
      ABE_DEMO_TIMEOUT_MS: '5000'
      # Set to "true" only when a trusted reverse proxy sets X-Forwarded-For.
      ABE_DEMO_TRUST_PROXY: 'false'
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
