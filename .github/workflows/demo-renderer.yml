name: demo-renderer

on:
  push:
    branches:
      - master
      - update
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - update

# Least privilege by default; the publish job widens it for itself only.
permissions:
  contents: read

concurrency:
  group: demo-renderer-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/abecms/abecms-demo

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Demo gateway tests
        run: npm run test:demo

      - name: Build distribution
        run: npm run distribute

      - name: Audit (report only)
        run: npm audit --omit=dev || true

  build:
    name: build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)

          # Ephemeral token, generated per run and never printed.
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"

          docker run -d --name abecms-demo-ci \
            -e ABE_DEMO_API_TOKEN="$TOKEN" \
            -p 8080:8080 "$IMAGE"

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 2
          done

          # /health is unauthenticated for probes.
          curl -sf http://127.0.0.1:8080/health > /dev/null

          # Authenticated calls succeed.
          curl -sf -H "authorization: Bearer $TOKEN" \
            http://127.0.0.1:8080/schema > /dev/null
          curl -sf -X POST -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d '{"title":"ci","status":"draft"}' \
            http://127.0.0.1:8080/render > /dev/null

          # Unauthenticated calls are rejected.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/schema)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"title":"ci"}' \
            http://127.0.0.1:8080/render)" = "401"

          # The back office stays hidden, with or without a credential.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/abe/users)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            -H "authorization: Bearer $TOKEN" http://127.0.0.1:8080/abe/users)" = "404"

          # The container must refuse to start with no credential configured.
          if docker run --rm --name abecms-demo-ci-noauth "$IMAGE"; then
            echo "gateway started without ABE_DEMO_API_TOKEN" >&2
            exit 1
          fi

          docker rm -f abecms-demo-ci
