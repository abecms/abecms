# Local run of the ABECMS demo renderer.
#
# No host volume is mounted and no secret is required: the gateway is
# stateless and reads only the fixed demo site baked into the image.
services:
  abecms-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    image: ghcr.io/abecms/abecms-demo:local
    container_name: abecms-demo
    init: true
    read_only: true
    user: '1000:1000'
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ABE_DEMO_PORT: '8080'
      ABE_DEMO_HOST: '0.0.0.0'
      ABE_DEMO_RATE_MAX: '60'
      ABE_DEMO_RATE_WINDOW_MS: '60000'
      ABE_DEMO_TIMEOUT_MS: '5000'
      # Set to "true" only when a trusted reverse proxy sets X-Forwarded-For.
      ABE_DEMO_TRUST_PROXY: 'false'
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
